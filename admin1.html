<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shesheny Motors - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        surface: "#131313",
                        "on-surface": "#e5e2e1",
                        primary: "#e9c176",
                        "surface-container-low": "#1c1b1b",
                        "surface-container-highest": "#353534",
                        "outline-variant": "#4e4639"
                    },
                    fontFamily: {
                        headline: ["Noto Serif", "serif"],
                        body: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { border-bottom: 2px solid #e9c176; color: #e9c176; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body h-screen flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-surface-container-low border-r border-outline-variant/30 flex flex-col">
        <div class="p-6 border-b border-outline-variant/30">
            <h2 class="text-xl font-headline text-primary">Shesheny Admin</h2>
        </div>
        <nav class="flex-grow p-4 space-y-2">
            <button class="tab-btn active w-full text-left px-4 py-3 rounded hover:bg-surface-container-highest text-sm font-medium text-on-surface-variant flex items-center gap-3" data-target="tab-vehicles">
                <span class="material-symbols-outlined">directions_car</span> Vehicles
            </button>
            <button class="tab-btn w-full text-left px-4 py-3 rounded hover:bg-surface-container-highest text-sm font-medium text-on-surface-variant flex items-center gap-3" data-target="tab-settings">
                <span class="material-symbols-outlined">settings</span> Global Settings
            </button>
            <button class="tab-btn w-full text-left px-4 py-3 rounded hover:bg-surface-container-highest text-sm font-medium text-on-surface-variant flex items-center gap-3" data-target="tab-inquiries">
                <span class="material-symbols-outlined">mail</span> Inquiries
            </button>
        </nav>
        <div class="p-4 border-t border-outline-variant/30">
            <button id="logout-btn" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-red-400/10 rounded flex items-center gap-3">
                <span class="material-symbols-outlined">logout</span> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow overflow-y-auto bg-surface p-8">
        
        <!-- Vehicles Tab -->
        <div id="tab-vehicles" class="tab-content active max-w-4xl">
            <h1 class="text-3xl font-headline text-primary mb-8">Manage Vehicles</h1>
            <div class="bg-surface-container-low p-6 rounded border border-outline-variant/30 mb-8">
                <h2 class="text-xl mb-4 font-medium">Add New Vehicle</h2>
                <form id="add-vehicle-form" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="v-brand" placeholder="Brand" required class="bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                        <input type="text" id="v-model" placeholder="Model" required class="bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                        <input type="number" id="v-year" placeholder="Year" required class="bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                        <input type="number" id="v-price-egp" placeholder="Price (EGP)" required class="bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                        <input type="number" id="v-price-usd" placeholder="Price (USD)" required class="bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                        <input type="text" id="v-condition" placeholder="Condition (New/Used)" required class="bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                        <input type="text" id="v-color" placeholder="Color" required class="bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                        <input type="text" id="v-hp" placeholder="Horsepower" required class="bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                        <input type="number" step="0.1" id="v-accel" placeholder="0-60 (s)" required class="bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                        <input type="number" id="v-miles" placeholder="Miles" required class="bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                        <input type="url" id="v-video" placeholder="Video Embed URL (optional)" class="bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface col-span-2">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-on-surface-variant">Thumbnail Image</label>
                        <input type="file" id="v-thumb" accept="image/*" class="w-full text-sm">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-on-surface-variant">Gallery Images (Multiple)</label>
                        <input type="file" id="v-gallery" accept="image/*" multiple class="w-full text-sm">
                    </div>
                    <button type="submit" class="bg-primary text-black px-6 py-2 rounded font-medium hover:brightness-110">Upload Vehicle</button>
                </form>
            </div>
            
            <h2 class="text-xl mb-4 font-medium">Existing Inventory</h2>
            <div id="admin-inventory-list" class="space-y-4">
                <!-- Populated via JS -->
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="tab-settings" class="tab-content max-w-2xl">
            <h1 class="text-3xl font-headline text-primary mb-8">Global Settings</h1>
            <form id="settings-form" class="space-y-6 bg-surface-container-low p-6 rounded border border-outline-variant/30">
                <div>
                    <label class="block text-sm mb-2 text-on-surface-variant">WhatsApp Number (e.g. +201067776777)</label>
                    <input type="text" id="s-whatsapp" class="w-full bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                </div>
                <div>
                    <label class="block text-sm mb-2 text-on-surface-variant">Call Number</label>
                    <input type="text" id="s-call" class="w-full bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                </div>
                <div>
                    <label class="block text-sm mb-2 text-on-surface-variant">Google Maps Embed HTML</label>
                    <textarea id="s-map" rows="4" class="w-full bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface"></textarea>
                </div>
                <div>
                    <label class="block text-sm mb-2 text-on-surface-variant text-primary font-bold">Event Theme</label>
                    <select id="s-theme" class="w-full bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface">
                        <option value="none">Default (No Event)</option>
                        <option value="ramadan">Ramadan</option>
                        <option value="coptic">Coptic Christmas</option>
                        <option value="police">Police Day</option>
                    </select>
                </div>
                <button type="submit" class="bg-primary text-black px-6 py-2 rounded font-medium hover:brightness-110">Save Settings</button>
            </form>
        </div>

        <!-- Inquiries Tab -->
        <div id="tab-inquiries" class="tab-content">
            <h1 class="text-3xl font-headline text-primary mb-8">Inquiries</h1>
            <div class="bg-surface-container-low rounded border border-outline-variant/30 overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-surface-container-highest border-b border-outline-variant/30">
                        <tr>
                            <th class="p-4 font-medium text-on-surface-variant">Date</th>
                            <th class="p-4 font-medium text-on-surface-variant">Name</th>
                            <th class="p-4 font-medium text-on-surface-variant">Contact</th>
                            <th class="p-4 font-medium text-on-surface-variant">Type</th>
                            <th class="p-4 font-medium text-on-surface-variant">Message</th>
                        </tr>
                    </thead>
                    <tbody id="inquiries-tbody" class="divide-y divide-outline-variant/10">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
