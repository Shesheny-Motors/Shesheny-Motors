<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Shesheny Motors - Update Password</title>
    <meta name="description" content="Set a new password for your Shesheny Motors account.">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#e9c176",
                        "primary-container": "#c5a059",
                        "on-primary": "#412d00",
                        "surface": "#131313",
                        "surface-container": "#201f1f",
                        "surface-container-high": "#2a2a2a",
                        "surface-container-highest": "#353534",
                        "surface-container-low": "#1c1b1b",
                        "surface-container-lowest": "#0e0e0e",
                        "on-surface": "#e5e2e1",
                        "on-surface-variant": "#d1c5b4",
                        "outline": "#9a8f80",
                        "outline-variant": "#4e4639",
                        "error": "#ffb4ab",
                        "error-container": "#93000a",
                        "background": "#131313"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.5s ease-out forwards; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .shimmer-border {
            background: linear-gradient(90deg, transparent 25%, rgba(233,193,118,0.3) 50%, transparent 75%);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }
        .input-field:focus { box-shadow: 0 0 0 2px rgba(233,193,118,0.15); }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
<div class="noise-overlay"></div>

<!-- Background decorative elements -->
<div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-primary/[0.03] rounded-full blur-[120px] -translate-y-1/2 translate-x-1/3"></div>
    <div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-primary/[0.02] rounded-full blur-[100px] translate-y-1/2 -translate-x-1/3"></div>
</div>

<div class="w-full max-w-md mx-auto px-6 relative z-10">
    <!-- Logo / Brand -->
    <div class="text-center mb-10 animate-fade-up" style="animation-delay: 0ms;">
        <a href="/" class="inline-block group">
            <h1 class="text-2xl font-headline font-bold tracking-tight text-amber-200 group-hover:text-amber-100 transition-colors">Shesheny Motors</h1>
            <p class="text-[10px] tracking-[0.25em] uppercase text-zinc-500 mt-1 font-medium">You Are Safe With Us</p>
        </a>
    </div>

    <!-- Auth Card -->
    <div class="relative animate-fade-up" style="animation-delay: 100ms;">
        <!-- Shimmer border effect -->
        <div class="absolute -inset-[1px] rounded-2xl shimmer-border"></div>
        
        <div class="relative bg-surface-container-low border border-outline-variant/20 rounded-2xl p-8 md:p-10 shadow-2xl">
            <h2 class="text-xl font-headline font-semibold text-center text-amber-100 mb-6">Update Your Password</h2>

            <!-- Error / Success Banner -->
            <div id="auth-message" class="hidden mb-6 px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2"></div>

            <!-- Update Password Form -->
            <form id="form-update-password" class="space-y-5" onsubmit="handleUpdatePassword(event)">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold uppercase tracking-widest text-zinc-500">New Password</label>
                    <div class="relative">
                        <input type="password" id="new-password" required minlength="6"
                            class="input-field w-full bg-surface-container border border-outline-variant/30 text-on-surface px-4 py-3.5 rounded-xl focus:outline-none focus:border-primary/50 transition-all placeholder:text-zinc-600 pr-12"
                            placeholder="Min. 6 characters">
                        <button type="button" onclick="togglePassword('new-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-600 hover:text-zinc-400 transition-colors">
                            <span class="material-symbols-outlined text-xl">visibility_off</span>
                        </button>
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold uppercase tracking-widest text-zinc-500">Confirm New Password</label>
                    <div class="relative">
                        <input type="password" id="confirm-password" required minlength="6"
                            class="input-field w-full bg-surface-container border border-outline-variant/30 text-on-surface px-4 py-3.5 rounded-xl focus:outline-none focus:border-primary/50 transition-all placeholder:text-zinc-600 pr-12"
                            placeholder="Min. 6 characters">
                        <button type="button" onclick="togglePassword('confirm-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-600 hover:text-zinc-400 transition-colors">
                            <span class="material-symbols-outlined text-xl">visibility_off</span>
                        </button>
                    </div>
                </div>
                <button type="submit" id="btn-update"
                    class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold py-4 rounded-xl hover:scale-[1.02] hover:shadow-[0_0_30px_rgba(233,193,118,0.15)] active:scale-[0.98] transition-all duration-200 text-sm tracking-widest uppercase flex items-center justify-center gap-2 mt-6">
                    <span id="update-text">Update Password</span>
                    <div id="update-spinner" class="hidden w-4 h-4 border-2 border-on-primary/30 border-t-on-primary rounded-full animate-spin"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- Back to home -->
    <div class="text-center mt-8 animate-fade-up" style="animation-delay: 200ms;">
        <a href="/" class="inline-flex items-center gap-1.5 text-zinc-600 hover:text-zinc-400 transition-colors text-sm font-medium">
            <span class="material-symbols-outlined text-base">arrow_back</span>
            Back to Home
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/auth.js"></script>
<script>
    function showMessage(text, type = 'error') {
        const el = document.getElementById('auth-message');
        el.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'bg-green-500/10', 'text-green-400');
        if (type === 'error') {
            el.classList.add('bg-red-500/10', 'text-red-400');
            el.innerHTML = `<span class="material-symbols-outlined text-base">error</span> ${text}`;
        } else {
            el.classList.add('bg-green-500/10', 'text-green-400');
            el.innerHTML = `<span class="material-symbols-outlined text-base">check_circle</span> ${text}`;
        }
    }

    function setLoading(loading) {
        const btn = document.getElementById(`btn-update`);
        const text = document.getElementById(`update-text`);
        const spinner = document.getElementById(`update-spinner`);
        btn.disabled = loading;
        if (loading) {
            text.classList.add('opacity-50');
            spinner.classList.remove('hidden');
        } else {
            text.classList.remove('opacity-50');
            spinner.classList.add('hidden');
        }
    }

    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('span');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility_off';
        }
    }

    async function handleUpdatePassword(e) {
        e.preventDefault();
        
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword !== confirmPassword) {
            showMessage("Passwords don't match.", 'error');
            return;
        }

        setLoading(true);

        const { data, error } = await window.SheshenyAuth.updateUserPassword(newPassword);
        
        setLoading(false);

        if (error) {
            showMessage(error.message, 'error');
        } else {
            showMessage('Password updated successfully! Redirecting to login...', 'success');
            setTimeout(() => { window.location.href = '/login/'; }, 2000);
        }
    }
    
    // Check if user session exists (either through implicit flow or existing session)
    (async () => {
        // Wait a small amount for the hash to be parsed if coming from implicit flow
        setTimeout(async () => {
            const session = await window.SheshenyAuth.getSession();
            if (!session) {
                showMessage('No valid session found. If you just clicked a link, it might have expired.', 'error');
                document.getElementById('btn-update').disabled = true;
                document.getElementById('btn-update').classList.add('opacity-50', 'cursor-not-allowed');
            }
        }, 500);
    })();
</script>
</body>
</html>
