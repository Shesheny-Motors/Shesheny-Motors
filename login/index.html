<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Shesheny Motors - Sign In</title>
<meta name="description" content="Sign in to your Shesheny Motors account to manage your deposits, favorites, and vehicle reservations.">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Serif:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "primary": "#e9c176",
                    "primary-container": "#c5a059",
                    "on-primary": "#412d00",
                    "surface": "#131313",
                    "surface-container": "#201f1f",
                    "surface-container-high": "#2a2a2a",
                    "surface-container-highest": "#353534",
                    "surface-container-low": "#1c1b1b",
                    "surface-container-lowest": "#0e0e0e",
                    "on-surface": "#e5e2e1",
                    "on-surface-variant": "#d1c5b4",
                    "outline": "#9a8f80",
                    "outline-variant": "#4e4639",
                    "error": "#ffb4ab",
                    "error-container": "#93000a",
                    "background": "#131313"
                },
                "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
                },
                "fontFamily": {
                    "headline": ["Noto Serif", "serif"],
                    "body": ["Inter", "sans-serif"],
                    "label": ["Inter", "sans-serif"]
                }
            }
        }
    }
</script>
<link rel="stylesheet" href="../css/style.css">
<style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-up { animation: fadeUp 0.5s ease-out forwards; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .shimmer-border {
        background: linear-gradient(90deg, transparent 25%, rgba(233,193,118,0.3) 50%, transparent 75%);
        background-size: 200% 100%;
        animation: shimmer 3s ease-in-out infinite;
    }
    .input-field:focus { box-shadow: 0 0 0 2px rgba(233,193,118,0.15); }
</style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
<div class="noise-overlay"></div>

<!-- Background decorative elements -->
<div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-primary/[0.03] rounded-full blur-[120px] -translate-y-1/2 translate-x-1/3"></div>
    <div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-primary/[0.02] rounded-full blur-[100px] translate-y-1/2 -translate-x-1/3"></div>
</div>

<div class="w-full max-w-md mx-auto px-6 relative z-10">
    <!-- Logo / Brand -->
    <div class="text-center mb-10 animate-fade-up" style="animation-delay: 0ms;">
        <a href="/" class="inline-block group">
            <h1 class="text-2xl font-headline font-bold tracking-tight text-amber-200 group-hover:text-amber-100 transition-colors">Shesheny Motors</h1>
            <p class="text-[10px] tracking-[0.25em] uppercase text-zinc-500 mt-1 font-medium">You Are Safe With Us</p>
        </a>
    </div>

    <!-- Auth Card -->
    <div class="relative animate-fade-up" style="animation-delay: 100ms;">
        <!-- Shimmer border effect -->
        <div class="absolute -inset-[1px] rounded-2xl shimmer-border"></div>
        
        <div class="relative bg-surface-container-low border border-outline-variant/20 rounded-2xl p-8 md:p-10 shadow-2xl">
            <!-- Tab Switcher -->
            <div class="flex mb-8 bg-surface-container-highest/50 rounded-xl p-1">
                <button id="tab-signin" class="flex-1 py-2.5 text-sm font-medium rounded-lg transition-all duration-300 text-on-surface bg-surface-container-high shadow-sm" onclick="switchTab('signin')">
                    Sign In
                </button>
                <button id="tab-signup" class="flex-1 py-2.5 text-sm font-medium rounded-lg transition-all duration-300 text-zinc-500 hover:text-zinc-300" onclick="switchTab('signup')">
                    Create Account
                </button>
            </div>

            <!-- Error / Success Banner -->
            <div id="auth-message" class="hidden mb-6 px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2"></div>

            <!-- Sign In Form -->
            <form id="form-signin" class="space-y-5" onsubmit="handleSignIn(event)">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold uppercase tracking-widest text-zinc-500">Email</label>
                    <input type="email" id="signin-email" required
                        class="input-field w-full bg-surface-container border border-outline-variant/30 text-on-surface px-4 py-3.5 rounded-xl focus:outline-none focus:border-primary/50 transition-all placeholder:text-zinc-600"
                        placeholder="your@email.com">
                </div>
                <div class="space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold uppercase tracking-widest text-zinc-500">Password</label>
                        <button type="button" onclick="handleForgotPassword(event)" class="text-xs font-medium text-primary hover:text-primary-container transition-colors focus:outline-none">Forgot Password?</button>
                    </div>
                    <div class="relative">
                        <input type="password" id="signin-password" required
                            class="input-field w-full bg-surface-container border border-outline-variant/30 text-on-surface px-4 py-3.5 rounded-xl focus:outline-none focus:border-primary/50 transition-all placeholder:text-zinc-600 pr-12"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePassword('signin-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-600 hover:text-zinc-400 transition-colors">
                            <span class="material-symbols-outlined text-xl">visibility_off</span>
                        </button>
                    </div>
                </div>
                <button type="submit" id="btn-signin"
                    class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold py-4 rounded-xl hover:scale-[1.02] hover:shadow-[0_0_30px_rgba(233,193,118,0.15)] active:scale-[0.98] transition-all duration-200 text-sm tracking-widest uppercase flex items-center justify-center gap-2">
                    <span id="signin-text">Sign In</span>
                    <div id="signin-spinner" class="hidden w-4 h-4 border-2 border-on-primary/30 border-t-on-primary rounded-full animate-spin"></div>
                </button>
            </form>

            <!-- Sign Up Form -->
            <form id="form-signup" class="space-y-5 hidden" onsubmit="handleSignUp(event)">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold uppercase tracking-widest text-zinc-500">Full Name</label>
                    <input type="text" id="signup-name" required
                        class="input-field w-full bg-surface-container border border-outline-variant/30 text-on-surface px-4 py-3.5 rounded-xl focus:outline-none focus:border-primary/50 transition-all placeholder:text-zinc-600"
                        placeholder="John Doe">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold uppercase tracking-widest text-zinc-500">Email</label>
                    <input type="email" id="signup-email" required
                        class="input-field w-full bg-surface-container border border-outline-variant/30 text-on-surface px-4 py-3.5 rounded-xl focus:outline-none focus:border-primary/50 transition-all placeholder:text-zinc-600"
                        placeholder="your@email.com">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold uppercase tracking-widest text-zinc-500">Password</label>
                    <div class="relative">
                        <input type="password" id="signup-password" required minlength="6"
                            class="input-field w-full bg-surface-container border border-outline-variant/30 text-on-surface px-4 py-3.5 rounded-xl focus:outline-none focus:border-primary/50 transition-all placeholder:text-zinc-600 pr-12"
                            placeholder="Min. 6 characters">
                        <button type="button" onclick="togglePassword('signup-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-600 hover:text-zinc-400 transition-colors">
                            <span class="material-symbols-outlined text-xl">visibility_off</span>
                        </button>
                    </div>
                </div>
                <button type="submit" id="btn-signup"
                    class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold py-4 rounded-xl hover:scale-[1.02] hover:shadow-[0_0_30px_rgba(233,193,118,0.15)] active:scale-[0.98] transition-all duration-200 text-sm tracking-widest uppercase flex items-center justify-center gap-2">
                    <span id="signup-text">Create Account</span>
                    <div id="signup-spinner" class="hidden w-4 h-4 border-2 border-on-primary/30 border-t-on-primary rounded-full animate-spin"></div>
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-4 my-8">
                <div class="flex-1 h-px bg-outline-variant/20"></div>
                <span class="text-xs text-zinc-600 font-medium uppercase tracking-widest">or</span>
                <div class="flex-1 h-px bg-outline-variant/20"></div>
            </div>

            <!-- Google Sign In -->
            <button onclick="handleGoogleSignIn()" id="btn-google"
                class="w-full bg-white hover:bg-gray-100 text-gray-800 font-medium py-3.5 rounded-xl transition-all duration-200 text-sm flex items-center justify-center gap-3 border border-gray-200 hover:shadow-md active:scale-[0.98]">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
        </div>
    </div>

    <!-- Back to home -->
    <div class="text-center mt-8 animate-fade-up" style="animation-delay: 200ms;">
        <a href="/" class="inline-flex items-center gap-1.5 text-zinc-600 hover:text-zinc-400 transition-colors text-sm font-medium">
            <span class="material-symbols-outlined text-base">arrow_back</span>
            Back to Shesheny Motors
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script>
    // Parse redirect URL from query params
    function getRedirectUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('redirect') || '/';
    }

    // If already logged in, redirect
    (async () => {
        if (window.SheshenyAuth) {
            const session = await window.SheshenyAuth.getSession();
            if (session) {
                window.location.href = getRedirectUrl();
            }
        }
    })();

    function switchTab(tab) {
        const signinTab = document.getElementById('tab-signin');
        const signupTab = document.getElementById('tab-signup');
        const signinForm = document.getElementById('form-signin');
        const signupForm = document.getElementById('form-signup');
        const msgEl = document.getElementById('auth-message');
        msgEl.classList.add('hidden');

        if (tab === 'signin') {
            signinTab.className = 'flex-1 py-2.5 text-sm font-medium rounded-lg transition-all duration-300 text-on-surface bg-surface-container-high shadow-sm';
            signupTab.className = 'flex-1 py-2.5 text-sm font-medium rounded-lg transition-all duration-300 text-zinc-500 hover:text-zinc-300';
            signinForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
        } else {
            signupTab.className = 'flex-1 py-2.5 text-sm font-medium rounded-lg transition-all duration-300 text-on-surface bg-surface-container-high shadow-sm';
            signinTab.className = 'flex-1 py-2.5 text-sm font-medium rounded-lg transition-all duration-300 text-zinc-500 hover:text-zinc-300';
            signupForm.classList.remove('hidden');
            signinForm.classList.add('hidden');
        }
    }

    function showMessage(text, type = 'error') {
        const el = document.getElementById('auth-message');
        el.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'bg-green-500/10', 'text-green-400');
        if (type === 'error') {
            el.classList.add('bg-red-500/10', 'text-red-400');
            el.innerHTML = `<span class="material-symbols-outlined text-base">error</span> ${text}`;
        } else {
            el.classList.add('bg-green-500/10', 'text-green-400');
            el.innerHTML = `<span class="material-symbols-outlined text-base">check_circle</span> ${text}`;
        }
    }

    function setLoading(form, loading) {
        const btn = document.getElementById(`btn-${form}`);
        const text = document.getElementById(`${form}-text`);
        const spinner = document.getElementById(`${form}-spinner`);
        btn.disabled = loading;
        if (loading) {
            text.classList.add('opacity-50');
            spinner.classList.remove('hidden');
        } else {
            text.classList.remove('opacity-50');
            spinner.classList.add('hidden');
        }
    }

    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('span');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility_off';
        }
    }

    async function handleSignIn(e) {
        e.preventDefault();
        setLoading('signin', true);
        const email = document.getElementById('signin-email').value;
        const password = document.getElementById('signin-password').value;

        const { data, error } = await window.SheshenyAuth.signInWithEmail(email, password);
        setLoading('signin', false);

        if (error) {
            showMessage(error.message === 'Invalid login credentials' 
                ? 'Invalid email or password. Please try again.' 
                : error.message, 'error');
        } else {
            showMessage('Welcome back! Redirecting...', 'success');
            setTimeout(() => { window.location.href = getRedirectUrl(); }, 800);
        }
    }

    async function handleForgotPassword(e) {
        e.preventDefault();
        const email = document.getElementById('signin-email').value;
        if (!email) {
            showMessage('Please enter your email address first.', 'error');
            return;
        }
        
        const { error } = await window.SheshenyAuth.resetPasswordForEmail(email);
        if (error) {
            showMessage(error.message, 'error');
        } else {
            showMessage('Password reset email sent! Check your inbox.', 'success');
        }
    }

    async function handleSignUp(e) {
        e.preventDefault();
        setLoading('signup', true);
        const name = document.getElementById('signup-name').value;
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;

        const { data, error } = await window.SheshenyAuth.signUpWithEmail(email, password, name);
        setLoading('signup', false);

        if (error) {
            showMessage(error.message, 'error');
        } else {
            if (data?.user?.identities?.length === 0) {
                showMessage('An account with this email already exists.', 'error');
            } else {
                // Try to auto-sign-in immediately after signup
                const { data: signInData, error: signInError } = await window.SheshenyAuth.signInWithEmail(email, password);
                if (!signInError && signInData?.session) {
                    showMessage('Account created! Redirecting...', 'success');
                    setTimeout(() => { window.location.href = getRedirectUrl(); }, 800);
                } else {
                    // Auto-login failed (e.g. email confirmation required)
                    showMessage('Account created! You can now sign in.', 'success');
                    setTimeout(() => switchTab('signin'), 1500);
                }
            }
        }
    }

    async function handleGoogleSignIn() {
        const { data, error } = await window.SheshenyAuth.signInWithGoogle();
        if (error) {
            showMessage('Google sign-in is not yet configured. Please use email & password.', 'error');
        }
        // OAuth will redirect automatically
    }
</script>
</body></html>
