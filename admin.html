<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shesheny Motors - Admin Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        surface: "#131313",
                        "on-surface": "#e5e2e1",
                        primary: "#e9c176",
                        "surface-container-low": "#1c1b1b",
                        "outline-variant": "#4e4639"
                    },
                    fontFamily: {
                        headline: ["Noto Serif", "serif"],
                        body: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body h-screen flex items-center justify-center">
    <div class="bg-surface-container-low p-8 rounded border border-outline-variant/30 w-full max-w-md shadow-2xl">
        <h1 class="text-3xl font-headline text-primary mb-6 text-center">Admin Access</h1>
        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-sm text-on-surface-variant mb-2">Email</label>
                <input type="email" id="email" required class="w-full bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface focus:ring-primary focus:border-primary">
            </div>
            <div>
                <label class="block text-sm text-on-surface-variant mb-2">Password</label>
                <input type="password" id="password" required class="w-full bg-surface border-outline-variant/50 rounded px-4 py-2 text-on-surface focus:ring-primary focus:border-primary">
            </div>
            <button type="submit" class="w-full bg-primary text-black font-semibold py-3 rounded hover:brightness-110 transition-all">Sign In</button>
            <div id="login-error" class="text-red-500 text-sm text-center hidden">Invalid credentials</div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(window.supabaseClient) {
                const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
                if(error) {
                    document.getElementById('login-error').classList.remove('hidden');
                } else {
                    window.location.href = 'admin1.html';
                }
            } else {
                // Mock success if supabase not fully integrated
                if(email === 'admin@shesheny.com' && password === 'admin') {
                    localStorage.setItem('admin_auth', 'true');
                    window.location.href = 'admin1.html';
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                }
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
