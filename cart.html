<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Shesheny Motors - Cart</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Serif:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#8fa5d6",
                        "surface-container-highest": "#353534",
                        "secondary-fixed": "#e4e2e1",
                        "on-primary-container": "#4e3700",
                        "tertiary": "#b0c6f9",
                        "primary-container": "#c5a059",
                        "outline": "#9a8f80",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#b0c6f9",
                        "secondary-container": "#474747",
                        "background": "#131313",
                        "on-background": "#e5e2e1",
                        "primary": "#e9c176",
                        "primary-fixed-dim": "#e9c176",
                        "error-container": "#93000a",
                        "on-secondary-container": "#b6b5b4",
                        "primary-fixed": "#ffdea5",
                        "inverse-surface": "#e5e2e1",
                        "on-primary-fixed": "#261900",
                        "on-surface-variant": "#d1c5b4",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#304671",
                        "surface-container-high": "#2a2a2a",
                        "surface-bright": "#3a3939",
                        "on-secondary": "#303030",
                        "on-primary": "#412d00",
                        "inverse-primary": "#775a19",
                        "surface": "#131313",
                        "on-tertiary-container": "#233a65",
                        "on-error": "#690005",
                        "surface-variant": "#353534",
                        "on-surface": "#e5e2e1",
                        "outline-variant": "#4e4639",
                        "surface-container": "#201f1f",
                        "on-primary-fixed-variant": "#5d4201",
                        "surface-tint": "#e9c176",
                        "on-tertiary": "#173059",
                        "inverse-on-surface": "#313030",
                        "surface-dim": "#131313",
                        "surface-container-low": "#1c1b1b",
                        "tertiary-fixed": "#d8e2ff",
                        "secondary": "#c8c6c5",
                        "on-secondary-fixed-variant": "#474747",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-tertiary-fixed": "#001a41",
                        "on-secondary-fixed": "#1b1c1c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
            opacity: 0.03;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }
    </style>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-surface text-on-surface font-body antialiased relative min-h-screen flex flex-col">
    <div class="noise-overlay"></div>
    <div class="event-overlay"></div>

    <shesheny-header></shesheny-header>

    <main class="flex-grow pt-32 pb-24 px-6 md:px-12 relative z-10">
        <div class="max-w-screen-xl mx-auto">
            <h1 class="font-headline text-4xl md:text-5xl font-bold mb-12 text-primary" data-i18n="cart_title">Your Cart</h1>
            
            <div id="cart-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Cart items loaded by JS -->
            </div>

            <div id="empty-state" class="hidden text-center py-20 bg-surface-container rounded border border-outline-variant/10">
                <span class="material-symbols-outlined text-6xl text-outline-variant mb-4">shopping_cart</span>
                <h2 class="text-2xl font-headline text-on-surface mb-2" data-i18n="cart_empty">Your cart is empty</h2>
                <p class="text-on-surface-variant font-body mb-8" data-i18n="cart_empty_desc">Explore our inventory and find your perfect vehicle.</p>
                <a href="inventory.html" class="bg-primary text-on-primary px-8 py-3 rounded font-label font-medium" data-i18n="cart_browse">Browse Inventory</a>
            </div>
        </div>
    </main>

    <shesheny-footer></shesheny-footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/dbCache.js"></script>
    <script src="js/components.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
