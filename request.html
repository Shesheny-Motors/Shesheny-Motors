<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Custom Request | Shesheny Motors</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Serif:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#c5a059",
                        "surface-container-highest": "#353534",
                        "background": "#131313",
                        "primary": "#e9c176",
                        "surface-bright": "#3a3939",
                        "on-primary": "#412d00",
                        "surface": "#131313",
                        "on-surface": "#e5e2e1",
                        "outline-variant": "#4e4639",
                        "surface-container": "#201f1f",
                        "surface-container-low": "#1c1b1b",
                        "surface-container-lowest": "#0e0e0e"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-surface text-on-surface font-body antialiased relative min-h-screen flex flex-col">
    <shesheny-header></shesheny-header>

    <main class="flex-grow pt-32 pb-24 px-6 md:px-12">
        <div class="max-w-3xl mx-auto">
            <h1 class="font-headline text-4xl md:text-5xl font-bold mb-4 text-primary text-center" data-i18n="request_title">Custom Request</h1>
            <p class="text-on-surface-variant text-center mb-12" data-i18n="request_subtitle">Let us source your dream vehicle. Fill out the details below and our team will get back to you shortly.</p>
            
            <form id="request-form" class="space-y-6 bg-surface-container-low p-8 md:p-12 rounded border border-outline-variant/10">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium mb-2" data-i18n="request_name">Name</label>
                        <input type="text" id="req-name" required class="w-full bg-surface-container-highest border border-outline-variant/30 rounded px-4 py-3 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" data-i18n="placeholder_name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2" data-i18n="request_phone">Phone</label>
                        <input type="tel" id="req-phone" required class="w-full bg-surface-container-highest border border-outline-variant/30 rounded px-4 py-3 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" data-i18n="placeholder_phone">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" data-i18n="request_email">Email</label>
                    <input type="email" id="req-email" required class="w-full bg-surface-container-highest border border-outline-variant/30 rounded px-4 py-3 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" data-i18n="placeholder_email">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium mb-2" data-i18n="request_car_label">Desired Car (Make & Model)</label>
                        <input type="text" id="req-car" required class="w-full bg-surface-container-highest border border-outline-variant/30 rounded px-4 py-3 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" data-i18n="placeholder_car">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2" data-i18n="request_budget_label">Estimated Budget (Optional)</label>
                        <input type="text" id="req-budget" class="w-full bg-surface-container-highest border border-outline-variant/30 rounded px-4 py-3 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" data-i18n="placeholder_budget">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" data-i18n="request_details_label">Additional Details / Message</label>
                    <textarea id="req-message" rows="4" class="w-full bg-surface-container-highest border border-outline-variant/30 rounded px-4 py-3 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" data-i18n="placeholder_message"></textarea>
                </div>
                <button type="submit" class="w-full bg-primary text-on-primary font-bold py-4 rounded hover:bg-primary-container transition-colors uppercase tracking-widest text-sm" id="req-submit-btn" data-i18n="request_submit">
                    Submit Request
                </button>
                <div id="req-success" class="hidden text-green-400 text-center font-medium mt-4">
                    Your request has been successfully submitted! Our team will contact you soon.
                </div>
                <div id="req-error" class="hidden text-red-400 text-center font-medium mt-4">
                    There was an error submitting your request. Please try again.
                </div>
            </form>
        </div>
    </main>

    <shesheny-footer></shesheny-footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/components.js"></script>
    <script src="js/request.js"></script>
</body>
</html>
